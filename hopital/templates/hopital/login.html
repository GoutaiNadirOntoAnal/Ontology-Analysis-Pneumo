{% extends 'main.html' %}
{% load static %}
{% block title %}Connexion{% endblock %}

{% block content %}
<div class="auth-layout">
    <section class="auth-illustration">
        <img src="{% static 'images/meds.png' %}" alt="Interface médicale">
    </section>

    <section class="auth-card">
        <span class="eyebrow"><i class="ri-lock-line"></i> Accès sécurisé</span>
        <h1>Connexion à la plateforme</h1>
        <p class="help-text mb-4">
            Connectez-vous avec votre compte pour accéder aux patients, aux dossiers médicaux et au module d’aide au diagnostic.
        </p>

        <form action="{% url 'login' %}" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="username">Nom d'utilisateur</label>
                <input type="text" id="username" class="form-control" name="username" required placeholder="Exemple : medecin01">
            </div>

            <div class="mb-4">
                <label class="form-label" for="password">Mot de passe</label>
                <input type="password" id="password" class="form-control" name="password" required placeholder="Votre mot de passe">
            </div>

            <button type="submit" class="btn btn-primary w-100">Se connecter</button>
        </form>
    </section>
</div>
{% endblock %}
