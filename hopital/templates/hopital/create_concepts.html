{% extends 'main.html' %}
{% load static %}
{% block title %}Create Ontology Elements{% endblock %}
{% block css %}
{% endblock %}
{% block content %}
    
    <form method="POST" action="{% url 'concepts' %}">
        {% csrf_token %}
        
        <label for="class_name">Class Name:</label>
        <input type="text" id="class_name" name="class_name" >
        
        <label for="data_property_name">Data Property Name:</label>
        <input type="text" id="data_property_name" name="data_property_name" >
        
        <label for="object_property_name">Object Property Name:</label>
        <input type="text" id="object_property_name" name="object_property_name" >
        
        <input type="submit" value="Create">
    </form>
{% endblock %}
